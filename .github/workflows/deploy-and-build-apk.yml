name: Deploy Website & Build Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web Storefront
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check & Build Production Bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://mtngwbrcywmmxfwrumxb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_NWI2NHZk2lbI9HW9Qh0S0Q_TxR_WyEE' }}
        run: |
          npm run lint
          npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

      # Deploy to Vercel automatically when VERCEL_TOKEN is set in GitHub Secrets
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes

      # Or trigger Render / Railway Deploy Hook URL if using a Node host for Express + APIs
      - name: Trigger Server Deploy Hook (Render / Railway / VPS)
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl -fsSL -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}"

  build-admin-apk:
    name: Build Inaya Admin Android APK
    needs: build-and-deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Capacitor & Native Plugins
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor-community/bluetooth-le

      - name: Initialize Android Project & Sync
        env:
          CAPACITOR_ADMIN_URL: ${{ secrets.CAPACITOR_ADMIN_URL || 'https://demosite.com/admin' }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-xxhdpi
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          npx cap sync android

      - name: Grant Android Bluetooth & Notification Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "BLUETOOTH_CONNECT" "$MANIFEST"; then
            sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>/' "$MANIFEST"
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Inaya-Admin.apk

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inaya-Admin-APK
          path: Inaya-Admin.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-latest
          name: Inaya Fashion Admin APK (Latest)
          files: Inaya-Admin.apk
          body: "Automatically built Android APK pointing to your live /admin panel with native notifications and Bluetooth thermal printer support."
