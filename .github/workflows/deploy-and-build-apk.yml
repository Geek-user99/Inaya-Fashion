name: Deploy Website & Build Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-web:
    name: Build & Deploy Web Storefront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check & Build Production Bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run lint
          npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Deploy to Vercel or Trigger Host Webhook (if configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel..."
            npx vercel --prod --token="$VERCEL_TOKEN" --yes
          elif [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering server deploy webhook..."
            curl -fsSL -X POST "$DEPLOY_WEBHOOK_URL"
          else
            echo "No deployment secret set yet — skipping remote deploy step (build succeeded)."
          fi

  build-admin-apk:
    name: Build Inaya Admin Android APK
    needs: build-and-deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Capacitor & Android Plugins
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor-community/bluetooth-le@6

      - name: Configure Admin URL & Sync Android Project
        env:
          CAPACITOR_ADMIN_URL: ${{ secrets.CAPACITOR_ADMIN_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            if (process.env.CAPACITOR_ADMIN_URL) {
              cfg.server.url = process.env.CAPACITOR_ADMIN_URL;
              cfg.server.cleartext = process.env.CAPACITOR_ADMIN_URL.startsWith("http://");
            }
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            console.log("Capacitor server.url =", cfg.server.url);
          '
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          for dir in mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
          done
          npx cap sync android

      - name: Grant Android Bluetooth & Notification Permissions
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(file, "utf8");
            const perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_ADMIN",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.BLUETOOTH_CONNECT"
            ];
            const toInsert = perms
              .filter((p) => !xml.includes(p))
              .map((p) => `    <uses-permission android:name="${p}" />`)
              .join("\n");
            if (toInsert) {
              xml = xml.replace("<application", `${toInsert}\n\n    <application`);
              fs.writeFileSync(file, xml);
            }
          '

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Inaya-Admin.apk

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inaya-Admin-APK
          path: Inaya-Admin.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-apk-latest
          name: Inaya Fashion Admin APK (Latest)
          files: Inaya-Admin.apk
          make_latest: true
          body: "Automatically built Android APK pointing to your /admin panel with native notifications and Bluetooth thermal printer support."
